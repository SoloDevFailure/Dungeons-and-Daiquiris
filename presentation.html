<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#101512">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="D&D Presentation">
  <title>Dungeons &amp; Daiquiris — Presentation</title>
  <link rel="manifest" href="presentation.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="presentation.css">
  <script src="config.js" defer></script>
  <script src="services/storage.js" defer></script>
  <script src="services/drink-history.js" defer></script>
  <script src="services/supabase.js" defer></script>
  <script src="services/connection.js" defer></script>
  <script src="presentation.js" defer></script>
  <script src="pwa.js" defer></script>
</head>
<body>
  <main>
    <div class="sigil" aria-hidden="true">D20</div>
    <p class="eyebrow">THE TAVERN IS OPEN</p>
    <h1>Dungeons <span>&amp;</span> Daiquiris</h1>
    <div class="rule" aria-hidden="true"></div>
    <p id="session-label" class="eyebrow"></p>
    <h2 id="waiting">Waiting for the first abomination</h2>
    <p class="description">Three rolls. Two servings. Questionable decisions.</p>
    <article id="encounter" hidden>
      <h2 id="drink-title"></h2><p id="drink-summary"></p>
      <ul id="display-ingredients"></ul><p id="display-stats"></p>
      <ol id="display-steps"></ol><div id="display-warnings"></div>
    </article>
    <p id="display-status" class="status" role="status">Waiting for a session link.</p>
  </main>
</body>
</html>
