 <radialGradient id="face"><stop stop-color="#234b3b"/><stop offset="1" stop-color="#071e17"/></radialGradient>
 <radialGradient id="glow"><stop stop-color="#d0a455" stop-opacity=".3"/><stop offset="1" stop-color="#d0a455" stop-opacity="0"/></radialGradient>
